services:
  - type: web
    name: reelvault
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: PARALLEL_DOWNLOADS
        value: 1
      - key: QUEUE_CAPACITY
        value: 8
      - key: ANALYSIS_WORKERS
        value: 1
      - key: ANALYSIS_QUEUE_LIMIT
        value: 4
      - key: MAX_MODEL_SCANS_PER_DAY
        value: 20
